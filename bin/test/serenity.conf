serenity {
    take.screenshots = FOR_EACH_ACTION
    console.colors = true
    logging = VERBOSE
    timeout = 10000
    wait.for.timeout = 10000
    # Tiempo de espera para validar visualmente que el registro fue exitoso:
    step.delay = 1000 
}

webdriver {
  driver = chrome
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = ["test-type", "no-sandbox", "ignore-certificate-errors", "start-maximized", "incognito", "disable-infobars", "disable-gpu", "disable-default-apps", "disable-popup-blocking"]
    }
  }
}

environments {
  default {
    webdriver.base.url = "https://demowebshop.tricentis.com/"
  }
}